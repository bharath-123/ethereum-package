participants_matrix:
  el:
    - el_type: geth
      el_image: ethpandaops/geth:fusaka-devnet-2
  cl:
    - cl_type: lighthouse
      cl_image: ethpandaops/lighthouse:fusaka-devnet-2
      supernode: true
      
additional_services:
  - dora
  - tx_fuzz
  - spamoor
  - assertoor

mev_type: mock

mev_params:
  mock_mev_image: ethpandaops/rustic-builder:fulu
  mev_boost_image: mev-boost-fulu:latest
  mev_builder_cl_image: sigp/ligthhouse:unstable

network_params:
  fulu_fork_epoch: 1
  bpo_1_epoch: 2
  bpo_1_max_blobs: 12
  bpo_1_target_blobs: 9
  bpo_2_epoch: 3
  bpo_2_max_blobs: 6
  bpo_2_target_blobs: 4
  bpo_3_epoch: 4
  bpo_3_max_blobs: 9
  bpo_3_target_blobs: 6
  bpo_4_epoch: 5
  bpo_4_max_blobs: 18
  bpo_4_target_blobs: 12
  bpo_5_epoch: 6
  bpo_5_max_blobs: 9
  bpo_5_target_blobs: 6
  withdrawal_type: "0x02"
  preset: mainnet

spamoor_params:
  image: ethpandaops/spamoor:master
  max_mem: 4000
  spammers:
    - scenario: eoatx
      config:
        throughput: 200
    - scenario: blobs
      config:
        throughput: 20


port_publisher:
  additional_services:
    enabled: true
    public_port_start: 36000
  mev:
    enabled: true
    public_port_start: 37000
  other:
    enabled: true
    public_port_start: 38000